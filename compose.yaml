version: '3.8'

services:
  db:
    image: postgres:18-alpine
    container_name: asas_livres_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: asas_livres_db
    ports:
      - "5436:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data: